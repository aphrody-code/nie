# Les deux seuls gabarits sont Bug et Fonctionnalité : une issue vide coûte un aller-retour
# pour obtenir la commande et sa sortie, qui sont les deux champs qui décident si elle est
# actionnable. Les autres besoins sont routés ci-dessous plutôt que déposés en issue.
blank_issues_enabled: false
contact_links:
  - name: Faille de sécurité
    url: https://github.com/aphrody-code/nie/security/advisories/new
    about: Avis privé. Ne jamais ouvrir d'issue publique pour une faille non corrigée (cf. SECURITY.md).
  - name: Question, usage, aide
    url: https://github.com/aphrody-code/nie/discussions
    about: Pour « comment faire », « est-ce que c'est possible », « pourquoi ce choix ».
  - name: Avant de signaler — les pièges d'environnement déjà connus
    url: https://github.com/aphrody-code/nie/blob/main/CONTRIBUTING.md#setting-up
    about: VFS non monté, NIE_GAME_DIR absente, feature Cargo éteinte, dépendance ../iecode manquante.
  - name: Contenu du jeu (assets, textes, tables)
    url: https://github.com/aphrody-code/nie/blob/main/NOTICE
    about: Ce dépôt ne redistribue aucun contenu LEVEL-5 et n'accepte aucune contribution qui en ajoute.
