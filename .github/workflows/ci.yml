# CI niers — runner SELF-HOSTED obligatoire.
#
# POURQUOI PAS UN RUNNER GITHUB
# Le dépôt dépend en `path` du dépôt frère `../aphrody` (8,1 Gio, privé) : sans lui,
# `cargo metadata` échoue avant même la première compilation. La toolchain est épinglée
# par `rust-toolchain.toml` (stable 1.98.1), le linker est mold, et les fixtures
# lourdes sont gitignorées. Vendoriser 8 Gio pour chaque exécution coûterait plus cher
# que ce que la CI vérifie.
#
# POURQUOI LA PORTE EST CADRÉE, ET POURQUOI ELLE RESTE UN SEUL JOB
# Le dépôt publie cinq surfaces (cli, mcp, site, desktop, model) et elles partagent
# l'essentiel de leurs crates : union des cinq fermetures = 36 des 47 membres, et `cli`
# n'en a aucune qui lui soit propre. Mesuré sur les 400 derniers commits, un job par
# surface coûterait 19 638 compilations de crate (21 475 si `nie-wasm` a sa lane) contre
# 18 800 pour un `clippy --workspace` — un découpage par surface est PLUS cher, parce que
# chaque crate partagée serait recompilée une fois par lane. Il ferait aussi tourner cinq
# `cargo` en parallèle sur un VPS où les compilations se font déjà tuer par l'OOM.
# La porte reste donc UN job, cadré sur l'UNION des surfaces que le diff peut avoir
# cassées : 10 026 compilations sur les mêmes 400 commits, soit 46,7 % de moins, parce que
# 34,5 % des commits n'atteignent aucune surface (docs, scripts, data) et que seuls 6,8 %
# touchent un manifeste partagé et exigent réellement les 47.
# `scripts/surfaces.ts` porte ce calcul ; il dérive les fermetures de `cargo metadata`, donc
# aucune liste ne peut dériver.
#
# CE QUE CE WORKFLOW NE FAIT PAS, ET POURQUOI
# · `cargo fmt --check` : le dépôt n'a jamais adopté les réglages par défaut de rustfmt
#   (454 fichiers d'écart au 14/8/2026, sans `rustfmt.toml` pour décrire le style réel).
#   Exiger ici un état que le dépôt n'a jamais eu rendrait la CI rouge en permanence,
#   donc muette. Adopter un style est une décision à prendre exprès, dans un commit
#   dédié — pas un effet de bord d'un gate.
# · `cargo build --workspace` et `cargo test --workspace` : l'édition de liens des ~100
#   binaires de test remplit le disque du VPS, qui tourne à 96 %. `clippy --all-targets`
#   type-vérifie exactement les mêmes cibles sans produire un seul exécutable ; c'est le
#   gate que le CLAUDE.md du dépôt désigne déjà comme référence. Les tests des quatre
#   crates du cœur, eux, sont assez légers pour être liés.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Pas de `cancel-in-progress` : il transformait toute exécution en attente en
# « cancelled », si bien que 98 exécutions sur 100 étaient annulées et qu'aucune n'a
# jamais rapporté ni succès ni échec. Une file qui attend est un signal ; une file qui
# s'annule est un silence.
concurrency:
  group: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: [self-hosted, niers-vps]
    timeout-minutes: 5
    outputs:
      surfaces: ${{ steps.plan.outputs.surfaces }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      # `fetch-depth: 0` : la base du diff doit exister localement, sinon `git diff` échoue
      # et la porte se croirait vide — un faux négatif silencieux.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quelles surfaces ce diff peut-il avoir cassées
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # `github.event.before` vaut 40 zéros sur une première poussée de branche : il n'y a
          # alors pas de base, et tout doit être vérifié plutôt que rien.
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          plan="$(bun run scripts/surfaces.ts plan --base "$base" --json)"
          echo "$plan"
          surfaces="$(echo "$plan" | bun -e 'const p=JSON.parse(await Bun.stdin.text()); console.log(p.surfaces.join(","))')"
          echo "surfaces=$surfaces" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$surfaces" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "### Portée du diff"
            echo
            echo "- base : \`$base\`"
            echo "- surfaces : ${surfaces:-_aucune — aucune porte Rust ne sera jouée_}"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: [self-hosted, niers-vps]
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Cible partagée avec l'arbre de travail : sur un disque à 96 %, un second
      # `target/` de plusieurs gigaoctets ferait tomber le déploiement d'azalée sous son
      # propre garde-fou (il refuse en dessous de 5 Gio libres).
      CARGO_TARGET_DIR: /home/ubuntu/niers/target
      SURFACES: ${{ needs.plan.outputs.surfaces }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain et dépendances présentes (pré-vol)
        run: |
          cargo --version
          command -v mold    || { echo 'mold absent'; exit 1; }
          test -d ../aphrody || { echo 'dépendance path ../aphrody absente'; exit 1; }
          # Desktop is a root workspace member; its Linux system libraries are required.
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1 || { echo 'Desktop GTK/WebKit system libraries absent'; exit 1; }
          test -f Cargo.lock && test ! -f apps/inacord/src-tauri/Cargo.lock || { echo 'Expected one root Cargo.lock'; exit 1; }
          df -h / | tail -1

      - name: Clippy cadré sur les surfaces touchées — 0 warning attendu
        run: |
          set -euo pipefail
          crates="$(bun -e '
            const { unionClosure } = await import("./scripts/surfaces.ts");
            const names = (process.env.SURFACES ?? "").split(",").filter(Boolean);
            console.log((await unionClosure(names)).join(" "));
          ')"
          echo "surfaces: $SURFACES"
          echo "crates gardés: $(echo "$crates" | wc -w) / 47"
          # shellcheck disable=SC2086
          cargo clippy --locked --all-targets $(for c in $crates; do printf -- '-p %s ' "$c"; done) -- -D warnings

      - name: Tests des crates du cœur (sans données sous copyright)
        run: cargo test -p nie-core -p nie-pe -p nie-asm -p nie-forge --locked

      - name: Build wasm (portabilité des crates du jeu)
        if: contains(needs.plan.outputs.surfaces, 'site')
        run: cargo build -p nie-wasm --target wasm32-unknown-unknown --release --locked

  scripts:
    # Le cliquet de types de `scripts/` : 55 fichiers TypeScript y vivaient sans qu'aucun
    # tsconfig ne les couvre, release et deploy compris. Cf. scripts/tsconfig.gate.json.
    runs-on: [self-hosted, niers-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:scripts
