name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/docs-manifest.json"
      - "scripts/docs/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/docs-manifest.json"
      - "scripts/docs/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

jobs:
  docs:
    runs-on: [self-hosted, niers-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation invariants
        run: bun run docs:check
