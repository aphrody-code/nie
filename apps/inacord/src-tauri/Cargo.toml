# Desktop host in the root Cargo workspace. SQLite sessions use the shared nie-explore rusqlite owner.
# Preserve edition 2021 and existing feature choices; bindings remain a development-only binary.
[package]
name = "inacord"
description = "Explorateur/éditeur du VFS (CPK) d'Inazuma Eleven: Victory Road — UI native Windows (Fluent/Mica)"
version = "0.5.11"
authors = ["niers"]
edition = "2021"
# Tauri invokes cargo run; select the application rather than the development binaries.
default-run = "inacord"


[lib]
name = "inacord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inacord"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
# Keep this utility out of default application bundles.
required-features = ["dev-bindings"]

[build-dependencies]
tauri-build.workspace = true

[features]
dev-bindings = []
real-fixtures = []

[dependencies]
tauri = { workspace = true, features = ["specta"] }
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-fs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
ureq = { workspace = true, features = ["tls", "json"] }

specta = { workspace = true, features = ["serde_json"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
specta-typescript.workspace = true

tauri-plugin-log.workspace = true
tauri-plugin-os.workspace = true
log.workspace = true
tauri-plugin-deep-link.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true

nie-formats = { workspace = true, features = ["serde", "textures", "images", "audio-decode"], default-features = true }
nie-explore = { workspace = true, default-features = true }
nie-save = { workspace = true, features = ["serde"] }
nie-data = { workspace = true, features = ["serde", "std"] }
nie-aphrody.workspace = true
nie-core.workspace = true
nie-trace = { workspace = true, default-features = true }
nie-queue = { workspace = true, default-features = true }
nie-forge.workspace = true
nie-pe = { workspace = true, default-features = true }
nie-dump.workspace = true
nie-viola.workspace = true
nie-geom.workspace = true
nie-app.workspace = true
nie-lua = { workspace = true, default-features = true }
zip.workspace = true
trash.workspace = true
nie-runtime.workspace = true
nie-steam = { workspace = true, default-features = true }
nie-tasks = { workspace = true, default-features = true }
async-trait.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg.workspace = true
clipboard-win = { workspace = true, features = ["std"] }

[[bin]]
name = "verif-familles"
path = "src/bin/verif-familles.rs"
required-features = ["dev-bindings"]
