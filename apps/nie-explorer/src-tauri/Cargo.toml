# Package Cargo autonome, volontairement HORS du workspace racine (`members = ["crates/*"]`) :
# une table [workspace] vide l'indique explicitement à Cargo (sinon il remonte l'arborescence
# et réclame d'être ajouté aux membres). Les crates niers sont réutilisées via chemins relatifs
# (cf. [dependencies] ci-dessous), pas via l'espace de travail.
[workspace]

[package]
name = "nie-explorer"
description = "Explorateur/éditeur du VFS (CPK) d'Inazuma Eleven: Victory Road — UI native Windows (Fluent/Mica)"
version = "0.4.0"
authors = ["niers"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nie_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Gate le test golden `glb_preview_png_en_process_sur_un_vrai_modele` (lib.rs) sur le vrai
# `data/` du jeu (57 Go, © Level-5, gitignored, absent du clone public) — même convention que
# `real-fixtures` (nie-formats), `real-saves` (nie-save), `real-audio` (nie-model-serve).
# Lancer : cargo test -p nie-explorer --lib --features real-fixtures
real-fixtures = []

[dependencies]
# Feature `specta` : implémente `specta::Type` (marqueur "argument à ignorer côté JS") pour les
# types injectés par Tauri (`State`, `AppHandle`…) — c'est ce qui permet à `tauri-specta` de
# générer des bindings TS sans que `state: tauri::State<VfsState>` apparaisse dans la signature
# exportée (vérifié dans le Cargo.toml de `tauri-specta` : `tauri = { features = ["specta"] }`).
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
# Client HTTP synchrone minimal — résolveur distant azalee (GraphQL/REST), désactivé tant que
# l'URL n'est pas renseignée côté UI (Paramètres). Pas de runtime async requis (appel bloquant
# dans un `tauri::command`, exécuté hors thread UI par Tauri).
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Génère les bindings TypeScript de `src/lib/api.ts` depuis les VRAIES signatures Rust des
# commandes (`#[specta::specta]`) — remplace le miroir manuel `invoke<T>("cmd", {...})` qui
# pouvait diverger silencieusement de `lib.rs` à chaque commande ajoutée/modifiée sans que rien
# ne le signale côté compilation.
specta = { version = "2.0.0-rc.25", features = ["serde_json"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"

# Forward-ouverture "Ouvrir avec" Explorer → instance déjà lancée (argv[1] = chemin du fichier).
# Updater : vérifie/télécharge/installe les nouvelles versions (desktop uniquement — pas de cible
# mobile dans ce projet). `tauri-plugin-process` fournit `relaunch()` après installation (requis
# côté JS par `@tauri-apps/plugin-updater`, cf. doc officielle du plugin updater).
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Crates niers réutilisées telles quelles (mêmes décodeurs que `niers vfs`, cf. CLAUDE.md
# anti-doublon) — chemins relatifs depuis apps/nie-explorer/src-tauri/, hors du workspace
# racine (members = ["crates/*"]), donc pinnées ici plutôt que via [workspace.dependencies].
#
# Inventaire COMPLET des 26 crates `crates/*` face à ce binaire (audit 2026-08-08, cf. `docs/
# PLAN.md` §3octies) : ce qui suit est la liste de TOUT ce qui est chargeable en dépendance
# Cargo directe (a un `src/lib.rs`, aucun conflit de lien natif). Les crates absentes de ce
# fichier le sont pour une raison Cargo dure, listée à la fin — jamais un oubli.
nie-formats = { path = "../../../crates/engine/nie-formats", features = ["serde", "textures", "audio-decode"] }
nie-explore = { path = "../../../crates/engine/nie-explore" }
# Saves IEVR (Lives, CRC32-keyed XOR) : décrypt/inspection/ré-encryptage → onglet Sauvegardes.
nie-save = { path = "../../../crates/engine/nie-save", features = ["serde"] }
# Modèles de données de jeu (skills/auras/chara_param/items…) — chargée pour un futur navigateur
# de données 100 % hors-ligne (sans miroir wiki), pas encore câblée dans une commande.
nie-data = { path = "../../../crates/engine/nie-data", features = ["serde", "std"] }
# Logique de jeu reversée (ballon/IA/état de match) — chargée pour de futurs outils de mod
# gameplay, pas encore câblée dans une commande.
nie-core = { path = "../../../crates/engine/nie-core" }
# RE en direct (lecture mémoire ReadProcessMemory native Windows) — chargée mais SANS commande
# exposée : EAC est présent sur cette installation, on n'attache pas au process au runtime
# de l'app de modding par défaut (cf. `docs/`).
nie-trace = { path = "../../../crates/forge/nie-trace" }
# Frontière BFS (redis) — chargée pour un futur outil RE intégré, pas encore câblée.
nie-queue = { path = "../../../crates/forge/nie-queue" }
# Types géométriques POD partagés (Vec2/Vec3) — déjà tiré transitivement via nie-core/
# nie-formats (dédup Phase 2), déclaré ici en direct pour un accès sans détour depuis les
# futures commandes de mod gameplay (placement/formation).
nie-geom = { path = "../../../crates/engine/nie-geom" }
# Cœur du jeu (GameState + trait Renderer) : PAS de wgpu/winit ici (nie-game, le hôte GPU, est
# un binaire séparé qui consomme nie-app — aucun conflit avec le WebView2 de Tauri). Chargée
# pour un futur onglet « prévisualiser un match/dialogue » rendu en framebuffer CPU, embarqué
# sans dépendre d'un process externe.
nie-app = { path = "../../../crates/engine/nie-app" }
# Rendu 3D CPU (rastérisation z-buffer, PAS de GPU) — appelée EN PROCESS par `vfs_glb_preview_
# png_b64`/`vfs_glb_preview_turntable_mp4_b64` (cf. commentaire de section dans lib.rs) : avant
# 2026-08-08 ces deux commandes shellaient vers un binaire compilé séparément
# (`target/{debug,release}/nie-render3d.exe`), introuvable dans TOUT build distribué de
# nie-explorer (`scripts/package.sh` ne packages QUE nie-game/nie-headless/nie-play/nie-runtime,
# `tauri.conf.json` n'a pas de `bundle.resources`/`externalBin` pour nie-render3d.exe) — l'aperçu
# 3D était donc silencieusement cassé hors poste de dev. Le rasterizer étant du pur-Rust
# `no_std`-friendly (`glb::parse`+`render::render`), l'appeler en lib direct élimine la
# dépendance au binaire ET le double aller-retour disque (écrire le GLB, relire le PNG).
nie-render3d = { path = "../../../crates/engine/nie-render3d" }
# VM Lua 5.2 RÉELLE du jeu (mlua/PUC-Rio 5.2.4 vendored) — dépendance désormais DIRECTE : l'onglet
# Lua ne se contente plus de décrire un `.lua.bin`, il le décode (`bytecode`), l'exécute et en
# inspecte les valeurs (`runtime`). Passer par `nie-explore` ne donnait accès qu'à
# `describe_content`, qui ne fait qu'une reconnaissance de signature.
nie-lua = { path = "../../../crates/engine/nie-lua" }
# Encodage PNG des frames rendues par nie-render3d (même crate/version que `nie-render3d`/
# `nie-game`/`nie-play` — pas de nouvelle dépendance pour le workspace, juste ajoutée ici aussi).
png = "0.18"
# Zip de `plugins/niers-blender` pour `bpy.ops.preferences.addon_install` (exige un vrai .zip, pas un
# dossier) — même version que `nie-steam` (décompression de manifestes CDN), pas de nouvelle
# version introduite dans le workspace.
zip = "2"
# Corbeille Windows RÉELLE (`IFileOperation`/`SHFileOperationW` sous le capot) — même crate que
# cosmic-files (`trash.rs` amont, lu en détail 2026-08-08 « lis vraiment le code de cosmic ») :
# `removeStagedFile`/`deleteModWorkspace` (mods) faisaient un `remove()` PERMANENT
# (`@tauri-apps/plugin-fs`, `std::fs::remove_file` sous le capot) sur du vrai travail
# utilisatrice (fichiers de mod édités) — aucun rattrapage possible en cas de clic accidentel.
trash = "5"
# Moteur de match top-down (World : physique ballon, 22 joueurs, buts) — chargée pour un futur
# onglet « simuler un match » embarqué (aujourd'hui : `nie-runtime`/`nie-match3d` en CLI headless
# séparée uniquement).
nie-runtime = { path = "../../../crates/engine/nie-runtime" }
# Téléchargement/dump natif de depots Steam (port du `Steam/` C# d'iecode sur `steamroom`) —
# chargée pour un futur onglet « vérifier/récupérer le dépôt IEVR », pas encore câblée dans une
# commande. Dépendance `tokio` (runtime async) : compatible avec l'exécuteur bloquant des
# commandes `tauri::command` existantes (appelée depuis un thread dédié, jamais le thread UI).
nie-steam = { path = "../../../crates/tools/nie-steam" }
# Orchestration de job annulable/pausable avec progression (architecture inspirée sd-task-system,
# implémentation originale) — remplace le scan VFS synchrone opaque de `vfs_all_entries` par un
# job chunké annulable, avec progression relayée par événement Tauri (`vfs-index-progress`,
# cf. `vfs_index_scan_start`/`vfsIndexDb.reindex`).
nie-tasks = { path = "../../../crates/tools/nie-tasks" }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt"] }
#
# Exclusions Cargo dures — PAS des oublis, chacune vérifiée (`cargo metadata`/lecture directe
# du Cargo.toml de chaque crate, 2026-08-08) :
# - `nie-wiki`/`nie-re`/`nie-index`/`nie-seed`/`nie-zukan`/`nie-model-serve` : dépendent
#   (directement ou via nie-index) de `rusqlite` (libsqlite3-sys 0.35, `links = "sqlite3"`) →
#   conflit de lien natif avec le `sqlx-sqlite` de tauri-plugin-sql (libsqlite3-sys 0.28), Cargo
#   interdit deux copies d'une lib `links`. Le miroir wiki est donc interrogé côté frontend via
#   tauri-plugin-sql (mêmes requêtes SQL que `nie-wiki::query`, copiées dans `src/lib/wikiDb.ts`)
#   — un seul moteur SQLite dans TOUT le binaire.
# - `nie-game`/`nie-headless`/`nie-play`/`nie-cli` : PAS de `src/lib.rs`, uniquement des `[[bin]]`
#   → aucun cible `lib` à lier, Cargo refuse ces crates comme `[dependencies]` quelle que soit
#   leur envie d'être réutilisées (contrainte dure, pas un choix). `nie-game` shippe en plus
#   wgpu/winit (2ᵉ contexte GPU natif dans un process WebView2) — même sans le blocage `[lib]`,
#   pas souhaitable à embarquer.
# - `nie-ffi` : `[lib] crate-type = ["cdylib"]` **sans** `"rlib"` → ne produit aucun artefact
#   linkable par un autre crate Rust (c'est une frontière FFI pour Bun/JS, pas une lib Rust
#   consommable) ; de toute façon redondante (n'expose rien que nie-formats/nie-core n'exposent
#   déjà en direct).
# - `nie-wasm` : `wasm-bindgen` compile nativement mais la sortie n'a de sens que sur
#   `wasm32-unknown-unknown` (glue JS) ; ses crates utiles (`nie-app`/`nie-runtime`/`nie-core`/
#   `nie-data`/`nie-save`/`nie-formats`) sont désormais TOUTES chargées ci-dessus en direct —
#   dépendre de `nie-wasm` en plus serait un doublon, pas un gain.
# - `nie-engine` : exclue du workspace Cargo lui-même (`exclude` racine) — portage RE non
#   validé, conservé en lecture seule comme carte de référence uniquement (cf. `docs/PLAN.md`
#   §3quinquies/§6 dédup Phase 0). Ne JAMAIS en dépendre tant qu'il n'est pas re-validé byte-exact.
# - `nie-lua` (VM Lua 5.2 réelle) : pas de dépendance directe nécessaire — déjà tirée
#   transitivement via `nie-explore` (`describe_content` l'appelle pour le bytecode `.lua.bin`).
#
# `IECODE.Core`/`IECODE.CLI` (C# .NET 10, `IECODE.sln` racine, `csharp/IECODE.Core*`) : référence
# de portage externe (cf. `docs/PLAN.md` intro « le moyen ≠ la fin »), PAS une crate Cargo — un
# projet .NET ne se « package » pas comme dépendance Rust. Utilisée en cross-vérification
# manuelle lors du portage d'encodeurs (`cpk_encode`/`g4tx_encode`, cf. `apps/nie-explorer/
# ROADMAP.md` §1.1/§1.2 et le commit `8eccadc`), jamais exécutée ni embarquée par ce binaire.

# `winreg` : lecture registre `HKLM\...\Valve\Steam` pour la VRAIE détection du dossier de jeu.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
# Presse-papiers FICHIERS natif Windows (CF_HDROP réel — ce que Ctrl+C dans l'Explorateur écrit,
# ce que Ctrl+V dans l'Explorateur/toute autre appli sait lire). Recherche 2026-08-08 (« inspire-
# toi de cosmic-files pour... les interactions OS/filesystem ») : l'ancien presse-papiers de
# nie-explorer (`@tauri-apps/plugin-clipboard-manager`, `writeText`/`readText`) ne portait QUE du
# texte — coller un chemin copié depuis l'Explorateur marchait par accident (le presse-papiers
# CONTIENT aussi `text/plain` en pratique), mais Ctrl+C depuis nie-explorer n'écrivait JAMAIS un
# CF_HDROP réel : impossible de coller un fichier "copié" ici dans l'Explorateur Windows.
# `clipboard-win` : wrapper sûr autour de `OpenClipboard`/`SetClipboardData`/`GetClipboardData`
# CF_HDROP (liste de chemins, format natif Windows — l'équivalent exact de `text/uri-list`/
# `x-special/gnome-copied-files` que cosmic-files pose sur le presse-papiers X11/Wayland, cf.
# `crates/clipboard.rs` du dépôt amont, ClipboardCopy/ClipboardPaste).
clipboard-win = { version = "5", features = ["std"] }
