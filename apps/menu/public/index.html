<!DOCTYPE html>
<!--
  niers — visualiseur menu principal Inazuma (réécriture pixel-perfect)

  Ce fichier affiche les textures réelles décodées du jeu :
    /assets/background.png       fond 2640x1100 (c) Level-5
    /assets/header_strip_fr.png  bandeau 5280x520, texte "MENU PRINCIPAL" en police jeu réelle
    /assets/icons_atlas_fr.png   atlas d'icones menu 2044x2012

  Lacune rendu documentée :
    Les panneaux 3D hero (AVATAR, VICTOIRES, VOTRE EQUIPE) requièrent le moteur
    de rendu nie-engine complet (skeletal animation + camera + shaders). Ils sont
    hors scope à ce stade — aucune substitution visuelle inventée n'est fournie.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inazuma Eleven VR — Menu principal</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    /* Stage 1280x720 (16:9) — dimensions cibles du jeu */
    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
    }

    /* Fond réel du menu — background.png (2640x1100, recadré sur 1280x720) */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Bandeau header — header_strip_fr.png (5280x520) */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 130px;
      overflow: hidden;
    }

    .header img {
      display: block;
      width: 1280px;
      height: auto;
      object-fit: none;
      object-position: left top;
    }

    /* Zone panneaux hero — hors scope moteur */
    .hero-panels {
      position: absolute;
      top: 130px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .out-of-scope-notice {
      color: rgba(255, 255, 255, 0.25);
      font-size: 11px;
      text-align: center;
      line-height: 1.6;
      pointer-events: none;
      user-select: none;
    }

    /* Atlas d'icones en bas à droite */
    .icons-preview {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 180px;
      height: 180px;
      overflow: hidden;
      opacity: 0.85;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .icons-preview img {
      width: 180px;
      height: auto;
      object-fit: none;
      object-position: left top;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div class="stage">

    <!-- Fond réel (mainmenu01 background) -->
    <img
      class="bg"
      src="/assets/background.png"
      alt="Menu background"
      draggable="false"
    >

    <!-- Bandeau header avec texte "MENU PRINCIPAL" en police jeu réelle -->
    <div class="header">
      <img
        src="/assets/header_strip_fr.png"
        alt="Header MENU PRINCIPAL"
        draggable="false"
      >
    </div>

    <!-- Panneaux hero : hors scope (requiert moteur nie-engine complet) -->
    <div class="hero-panels">
      <p class="out-of-scope-notice">
        Panneaux 3D hero (AVATAR / VICTOIRES / VOTRE EQUIPE)<br>
        hors scope — rendu skeletal animation non implémenté
      </p>
    </div>

    <!-- Atlas d'icones (coin bas-droit) — preuve chargement spritesheet réel -->
    <div class="icons-preview" title="icons_atlas_fr.png — atlas réel (2044x2012)">
      <img
        src="/assets/icons_atlas_fr.png"
        alt="Atlas icones menu"
        draggable="false"
      >
    </div>

  </div>
</body>
</html>
