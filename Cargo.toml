# niers — reverse-engineering + réimplémentation Rust headless/wasm d'Inazuma Eleven: Victory Road.
# Workspace racine. Conventions alignées sur l'écosystème aphrody (nightly-2026-05-17,
# edition 2024, lints RFC 3389, RE pur-Rust goblin+iced-x86). Voir docs/ARCHITECTURE.md.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Rose Griffon"]
repository = "https://github.com/rose-griffon/niers"
rust-version = "1.97"

[workspace.dependencies]
# erreurs : thiserror par-crate, anyhow en propagation, miette pour le CLI
anyhow = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# wasm / navigateur
wasm-bindgen = { version = "=0.2.121" }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { version = "0.1" }
getrandom = { version = "0.2" }
web-time = "1.1"
parking_lot = "0.12"


# sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# base de connaissance + frontière
rusqlite = { version = "0.37", features = ["bundled"] }
redis = { version = "0.27", features = ["r2d2"] }
r2d2 = "0.8"

# CLI / logging (conventions aphrody)
clap = { version = "4", features = ["derive", "color", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }

# RE pur-Rust (stack aphrody : goblin PE/ELF + iced-x86 désassembleur)
goblin = "0.10"
iced-x86 = "1.21"
# triage PE / disasm / strings / entropy réutilisés depuis aphrody (mêmes versions → cargo unifie)
aphrody-re = { path = "../aphrody/crates/aphrody-re" }
# call-graph pour la propagation de labels
petgraph = "0.6"

# hash / util
sha2 = "0.10"
hex = "0.4"
memmap2 = "0.9"
rayon = "1"
hashbrown = "0.14"

# crates internes
nie-index = { path = "crates/nie-index" }
nie-re = { path = "crates/nie-re" }
nie-queue = { path = "crates/nie-queue" }
nie-seed = { path = "crates/nie-seed" }
nie-formats = { path = "crates/nie-formats" }
nie-headless = { path = "crates/nie-headless" }
nie-save = { path = "crates/nie-save" }
nie-wiki = { path = "crates/nie-wiki" }
nie-core = { path = "crates/nie-core" }
nie-data = { path = "crates/nie-data" }

# tests CLI (dev-dep commune)
assert_cmd = "2"
tempfile = "3"

# Lints workspace (RFC 3389, hérités via [lints] workspace = true dans chaque crate)
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# Dev rapide pour la boucle RE : on optimise les DEPENDANCES (iced-x86, goblin, rusqlite,
# rayon…) à opt-level=2 — la boucle disasm/seed/propagate tourne ~5-10x plus vite en dev —
# tout en gardant les crates niers à opt-level=0 (compilation rapide à chaque edit).
[profile.dev.package."*"]
opt-level = 2
