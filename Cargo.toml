# niers — moteur Rust d'Inazuma Eleven: Victory Road, et forge de son binaire.
#
# OBJECTIF : produire `nie.exe` **identique au byte près** depuis ce workspace.
# Les crates sont donc rangées par rôle dans cette chaîne (cf. docs/FORGE.md) :
#
#   crates/forge/   la chaîne de production du binaire et le reverse qui l'alimente
#                   (nie-pe modèle PE · nie-asm encodeur x86-64 · nie-forge CLI ·
#                    nie-re/nie-dump/nie-index/nie-seed/nie-queue/nie-trace échafaudage RE)
#   crates/engine/  le moteur qui fait tourner le jeu en Rust — la matière que la
#                   forge doit finir par émettre (core, formats, data, render, …)
#   crates/tools/   outillage périphérique (CLI, wiki, steam, serveurs, tâches)
#   crates/archive/ portages conservés en référence, hors build
#
# Conventions alignées sur l'écosystème aphrody (Rust stable 1.98.1, edition 2024,
# lints RFC 3389, RE pur-Rust goblin+iced-x86). Voir docs/ARCHITECTURE.md.
[workspace]
resolver = "3"
members = ["crates/forge/*", "crates/engine/*", "crates/tools/*", "apps/inacord/src-tauri"]
# Headless commands retain their existing default selection. Desktop is an explicit
# member (`cargo check -p inacord`) and participates in --workspace gates.
default-members = ["crates/forge/*", "crates/engine/*", "crates/tools/*"]
# nie-engine = portage RE du moteur Level-5 (~15k LOC, 434 // EXTERN:) consommé par AUCUNE crate vivante.
# Hors build/test workspace, conservé comme RÉFÉRENCE de portage en lecture seule (cf. docs/PLAN.md).
exclude = ["crates/archive/nie-engine", "crates/tools/inacord"]
# crates/tools/inacord/ n'a pas de Cargo.toml (artefacts de build orphelins, cf. .coord —
# aucun pair actif dessus au 2026-09-10) ; exclu pour ne pas casser `crates/tools/*`.
# Le crate Tauri réel du dépôt est apps/inacord/src-tauri.

[workspace.package]
edition = "2024"
version = "0.6.0"
license = "MIT"
authors = ["Aphrody"]
repository = "https://github.com/aphrody-code/nie"
rust-version = "1.97"

[workspace.dependencies]
# erreurs : thiserror par-crate, anyhow en propagation, miette pour le CLI
anyhow = { version = "1" }
byteorder = { version = "1" }
thiserror = { version = "2" }
miette = { version = "7", features = ["fancy"] }

# wasm / navigateur
wasm-bindgen = { version = "=0.2.125" }
wasm-bindgen-futures = { version = "0.4" }
console_error_panic_hook = { version = "0.1" }
getrandom = { version = "0.2" }
web-time = { version = "1.1" }
parking_lot = { version = "0.12" }


# sérialisation
serde = { version = "1" }
serde_json = { version = "1", default-features = false }
schemars = { version = "1" }
# Official Rust SDK for the Model Context Protocol. Keep the same reviewed
# revision as the production aphrody-mcp sibling until the native niers MCP
# compatibility suite authorises an SDK upgrade.
rmcp = { version = "1.8.0" }

# base de connaissance + frontière
rusqlite = { version = "0.37" }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
redis = { version = "0.27" }
r2d2 = { version = "0.8" }

# CLI / logging (conventions aphrody)
clap = { version = "4" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "=0.3.22" }

# orchestration de jobs asynchrones (nie-tasks — architecture inspirée de sd-task-system,
# implémentation originale) : runtime tokio déjà tiré transitivement par tauri (nie-explorer)
tokio = { version = "1" }
futures-util = { version = "0.3" }
tokio-tungstenite = { version = "0.29" }
reqwest = { version = "0.13.4", default-features = false }
async-trait = { version = "0.1" }
uuid = { version = "1" }

# RE pur-Rust : goblin PE/ELF + iced-x86 désassembleur
goblin = { version = "0.10" }
iced-x86 = { version = "1.21" }
# Vues typées sans copie sur les en-têtes ELF/PE (module `headers` d'aphrody-re).
zerocopy = { version = "0.8" }
# Triage PE / disasm / strings / entropy. Crate INTERNALISÉ le 2026-08-15 : il
# vivait dans `../aphrody`, hors du dépôt, et une dépendance de chemin vers un
# répertoire voisin faisait dépendre la compilation de niers d'un arbre qui n'est
# ni versionné ici ni garanti présent. Seul le noyau de triage est repris
# (`lib.rs` + `headers`) ; les modules forensics d'aphrody — adobe, asar,
# electron, golang, google — et les modules sous drapeau — leveldb, magika,
# yara — sont écartés : `nie-re` n'appelle que `triage()` et `Format`.
aphrody-re = { version = "0.6.0", path = "crates/forge/aphrody-re" }

# décodage audio CRI (HCA, ACB, AWB) — licence MIT
cridecoder = { version = "0.2.3", default-features = false }

# AES (RustCrypto, MIT/Apache) — déchiffrement AES-256-CBC du cpk_list.cfg.bin
# (clé/IV embarqués dans nie.exe, reversés ; cf. cpk.rs). no_std + alloc.
aes = { version = "0.8", default-features = false }

# hash / util
sha2 = { version = "0.10" }
hex = { version = "0.4" }
base64 = { version = "0.22" }
memmap2 = { version = "0.9" }
rayon = { version = "1" }
hashbrown = { version = "0.14" }

# Recherche de fichiers et de contenu — le moteur de ripgrep/fd, pris en bibliothèque.
# `ignore` fournit le parcours parallèle qui respecte .gitignore ; `grep-*` la recherche
# ligne à ligne. Les prendre plutôt que réécrire un walk maison : ce sont les mêmes
# briques que les outils de référence, et elles sont d'un seul auteur (BurntSushi).
ignore = { version = "0.4" }
globset = { version = "0.4" }
grep-searcher = { version = "0.1" }
grep-regex = { version = "0.1" }

# RE en direct (runtime) : lecture mémoire d'un nie.exe sous Wine via process_vm_readv(2).
# FFI Linux-only, isolé dans le seul crate nie-trace (cf. son lib.rs).
libc = { version = "0.2" }

# crates internes
# forge : production du binaire
nie-pe = { version = "0.6.0", path = "crates/forge/nie-pe", default-features = false }
nie-asm = { version = "0.6.0", path = "crates/forge/nie-asm", default-features = false }
nie-forge = { version = "0.6.0", path = "crates/forge/nie-forge", default-features = false }
nie-index = { version = "0.6.0", path = "crates/forge/nie-index", default-features = false }
nie-trace = { version = "0.6.0", path = "crates/forge/nie-trace", default-features = false }
nie-re = { version = "0.6.0", path = "crates/forge/nie-re", default-features = false }
# Minidump (.dmp) : parsing + scan AOB. Extrait de nie-re pour n'avoir AUCUNE dépendance
# (hors thiserror) — c'est ce qui le rend liable par nie-explorer, contrairement à nie-re.
nie-dump = { version = "0.6.0", path = "crates/forge/nie-dump" }
nie-queue = { version = "0.6.0", path = "crates/forge/nie-queue", default-features = false }
nie-seed = { version = "0.6.0", path = "crates/forge/nie-seed", default-features = false }
nie-formats = { version = "0.6.0", path = "crates/engine/nie-formats", default-features = false }
nie-explore = { version = "0.6.0", path = "crates/engine/nie-explore", default-features = false }
nie-sql = { version = "0.6.0", path = "crates/engine/nie-sql" }
nie-headless = { version = "0.6.0", path = "crates/engine/nie-headless", default-features = false }
nie-save = { version = "0.6.0", path = "crates/engine/nie-save" }
nie-wiki = { version = "0.6.0", path = "crates/tools/nie-wiki" }
nie-core = { version = "0.6.0", path = "crates/engine/nie-core" }
nie-data = { version = "0.6.0", path = "crates/engine/nie-data" }
nie-ocgen = { version = "0.6.0", path = "crates/engine/nie-ocgen" }
# PAS de `nie-engine` ici : la crate est `exclude` du workspace (cf. plus haut) et aucune crate
# vivante ne la consomme. La déclarer invitait un `nie-engine.workspace = true` qui aurait ramené
# dans le build un portage conservé en lecture seule.
nie-model-serve = { version = "0.6.0", path = "crates/tools/nie-model-serve", default-features = false }
nie-zukan = { version = "0.6.0", path = "crates/tools/nie-zukan", default-features = false }
nie-lua = { version = "0.6.0", path = "crates/engine/nie-lua", default-features = false }
nie-app = { version = "0.6.0", path = "crates/engine/nie-app" }
nie-render3d = { version = "0.6.0", path = "crates/engine/nie-render3d" }
nie-aphrody = { version = "0.6.0", path = "crates/engine/nie-aphrody" }
# nie-ui : source unique, typée, des jetons de design du jeu (couleurs OKLCH, géométrie,
# mouvement) — génère le CSS de packages/inacord-ui/src/shell/game-tokens.css et relie
# nie-formats::sprite_sheet (icônes) aux jetons pour le Rust qui compose des images.
nie-ui = { version = "0.6.0", path = "crates/engine/nie-ui" }
# `nie-runtime` : le moteur de match. Declare ici parce que `nie-ffi` le consomme desormais —
# c'est ce qui rend la simulation pilotable depuis Python (`niepy`) et donc depuis Ren'Py.
nie-runtime = { version = "0.6.0", path = "crates/engine/nie-runtime" }
nie-viola = { version = "0.6.0", path = "crates/engine/nie-viola" }
nie-steam = { version = "0.6.0", path = "crates/tools/nie-steam", default-features = false }

# chaîne « image → SVG → raster » (skill pixel-perfect, crate nie-aphrody).
# Choix mesurés le 2026-09-05, avec les rejets et leur raison :
# plugins/niers-plugin/skills/pixel-perfect/references/bibliotheques.md
# À retenir : `dssim` est AGPL (banni, `image-compare` rend le même SSIM en MIT),
# potrace est GPL et sans crate, et `vtracer` tirerait un SECOND `image` (^0.23)
# plus clap 2 et pyo3. La vectorisation, elle, n'a tiré AUCUNE dépendance : suivre le
# contour d'un masque puis le simplifier tient dans `nie_aphrody::pixel`, et rend des chemins
# lisibles là où un traceur générique en rend des milliers.
image = { version = "0.25", default-features = false }
image-compare = { version = "0.5" }
palette = { version = "0.7", default-features = false }
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
tiny-skia = { version = "0.12" }

# tests CLI (dev-dep commune)
assert_cmd = { version = "2" }
tempfile = { version = "3" }

# Lints workspace (RFC 3389, hérités via [lints] workspace = true dans chaque crate)

# Existing host and library dependencies, centralized without changing their version requirements.
askama = { version = "0.16.1" }
axum = { version = "0.8.9", default-features = false }
bcdec_rs = { version = "0.2.0" }
blake3 = { version = "1.8.7" }
bytemuck = { version = "1" }
bytes = { version = "1.12.1" }
clipboard-win = { version = "5" }
criterion = { version = "0.8" }
dirs-next = { version = "2" }
eframe = { version = "=0.34.1", default-features = false }
flate2 = { version = "1" }
fyrox = { version = "1.0.1" }
fyroxed_base = { version = "1.0.1" }
googletest = { version = "0.14" }
http-body-util = { version = "0.1.4" }
ievr-tools = { version = "0.6.0", path = "crates/tools/ievr-tools", default-features = false }
image_dds = { version = "0.7", default-features = false }
log = { version = "0.4.34" }
mlua = { version = "0.11" }
moka = { version = "0.12.16" }
nie-bench = { version = "0.6.0", path = "crates/tools/nie-bench", default-features = false }
nie-camera = { version = "0.6.0", path = "crates/engine/nie-camera", default-features = false }
nie-cli = { version = "0.6.0", path = "crates/tools/nie-cli" }
nie-computer-use = { version = "0.6.0", path = "crates/tools/nie-computer-use", default-features = false }
nie-editor = { version = "0.6.0", path = "crates/tools/nie-editor", default-features = false }
nie-geom = { version = "0.6.0", path = "crates/engine/nie-geom" }
nie-tasks = { version = "0.6.0", path = "crates/tools/nie-tasks", default-features = false }
percent-encoding = { version = "2" }
png = { version = "0.18" }
pollster = { version = "0.4" }
rand = { version = "0.8" }
regex = { version = "1" }
scraper = { version = "0.22" }
specta = { version = "2.0.0-rc.25" }
specta-typescript = { version = "0.0.12" }
steamroom = { version = "0.2" }
steamroom-client = { version = "0.2" }
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-clipboard-manager = { version = "2" }
tauri-plugin-deep-link = { version = "2.4.10" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs = { version = "2" }
tauri-plugin-log = { version = "2.9.1" }
tauri-plugin-opener = { version = "2" }
tauri-plugin-os = { version = "2.3.2" }
tauri-plugin-process = { version = "2" }
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-window-state = { version = "2" }
tauri-specta = { version = "2.0.0-rc.25" }
tower = { version = "0.5.3" }
tower-http = { version = "0.6.11" }
trash = { version = "5" }
tree-sitter = { version = "0.26" }
tree-sitter-lua = { version = "0.5" }
ureq = { version = "2", default-features = false }
web-sys = { version = "0.3" }
wgpu = { version = "=29.0.3" }
windows-sys = { version = "0.59" }
winit = { version = "0.30" }
winreg = { version = "0.52" }
zip = { version = "2" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Rust 1.98 promotes this style rewrite to warn-by-default. Binary parsers deliberately use
# `chunks_exact` where ignoring or inspecting the remainder is part of their local contract;
# migrate those call sites crate-by-crate with format goldens instead of applying a blind rewrite.
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# Keep line-level backtraces while avoiding the full debug and incremental caches that made the
# complete workspace test graph exceed this release host's disk. Full symbols remain available
# explicitly through `cargo build --profile debugging`.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dev rapide pour la boucle RE : on optimise les DEPENDANCES (iced-x86, goblin, rusqlite,
# rayon…) à opt-level=2 — la boucle disasm/seed/propagate tourne ~5-10x plus vite en dev —
# tout en gardant les crates niers à opt-level=0 (compilation rapide à chaque edit).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.debugging]
inherits = "dev"
debug = "full"
incremental = true

# Browser production profile: optimize the Rust graph across crate boundaries and make panic
# behavior explicit. `wasm-bindgen` and `wasm-opt -O3` perform the final ABI/whole-module passes.
[profile.wasm-release]
inherits = "release"
lto = "fat"
panic = "abort"
strip = "symbols"
