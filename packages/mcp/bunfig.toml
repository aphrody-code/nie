# Bun lit le `bunfig.toml` du répertoire COURANT, sans hériter de celui de la racine : sans ce
# file, `cd packages/mcp && bun test` loses the repository preloads and native wiki tools
# injecté », alors que la même suite passe depuis la racine. Or `bun run test` à la racine
# lance justement `bun run --filter '*' test`, donc DEPUIS chaque paquet : c'est le cas normal,
# pas le cas particulier. Une suite doit rendre le même verdict d'où qu'on la lance.
#
# Le piège est d'autant plus coûteux ici que la garde du fichier de test, `hasMirror`, mesure la
# PRÉSENCE du miroir SQLite et non l'INJECTION du client : miroir présent et client absent, elle
# laissait tourner des tests qui ne pouvaient que rougir, au lieu de les ignorer ou de les servir.
# The mirror is local; tests use the native owner when it is available.
[test]
preload = [
	"../nie-plugin/src/register.ts",
	"../nie-plugin/src/happydom.ts",
]
coverage = false
