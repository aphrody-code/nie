[package]
name = "nie-wasm"
description = "Bindings WebAssembly pour nie-formats : expose detect, crilayla, @UTF au navigateur via wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# cdylib pour wasm-bindgen ; rlib pour que `cargo build --workspace` (natif) reste vert.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
nie-formats.workspace = true
serde_json.workspace = true

# wasm-bindgen épinglé à la même version qu'aphrody (=0.2.121).
# Gate via cfg(target_arch = "wasm32") dans le code source.
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

# getrandom avec feature "js" : requis si une dep transitive l'utilise sur wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
