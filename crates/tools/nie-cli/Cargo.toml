[package]
name = "nie-cli"
description = "Binaire `niers` : pilote la boucle RE (seed, propagate, coverage) et la frontière redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "niers"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nie-index.workspace = true
nie-seed.workspace = true
nie-queue.workspace = true
nie-re.workspace = true
nie-trace.workspace = true
nie-formats = { workspace = true, features = ["serde", "textures"] }
nie-explore.workspace = true
nie-save.workspace = true
nie-wiki.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true

# pré-décodage sprites menu (g4tx -> DDS -> RGBA -> PNG)
# default-features=false pour exclure `encode` (intel_tex_2 / C++ ISPC = linker error)
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
