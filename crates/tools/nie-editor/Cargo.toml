[package]
name = "nie-editor"
default-run = "nie-editor"
description = "Native NIE 3D editor with a shared DirectX 12, Vulkan, or OpenGL viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-editor"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
host = ["dep:clap", "dep:eframe", "nie-render3d/gpu"]

[lints]
workspace = true

[dependencies]
nie-render3d.workspace = true
# Version compatible with the engine's single wgpu 29 dependency.
eframe = { workspace = true, optional = true, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde_json = { workspace = true, default-features = true }

anyhow.workspace = true
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
