[package]
name = "nie-editor"
default-run = "nie-editor"
description = "Éditeur 3D NIE natif, viewport GPU partagé DirectX 12 / Vulkan / OpenGL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-editor"
path = "src/main.rs"

[[bin]]
name = "nie-editor-legacy"
path = "src/legacy_main.rs"
required-features = ["legacy-fyrox"]

[features]
default = []
legacy-fyrox = ["dep:fyrox", "dep:fyroxed_base", "dep:nie-formats"]

[lints]
workspace = true

[dependencies]
# Ancien hôte conservé sur demande ; le binaire par défaut emploie le renderer NIE partagé.
fyrox = { version = "1.0.1", optional = true }
fyroxed_base = { version = "1.0.1", optional = true }

# Assets réels du jeu : montage du VFS CPK + assemblage du modèle (G4MD+G4MG+G4TX).
nie-formats = { workspace = true, features = ["textures"], optional = true }
nie-render3d = { path = "../../engine/nie-render3d", features = ["gpu"] }
# Version compatible avec l'unique wgpu 29 du moteur.
eframe = { version = "=0.34.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde.workspace = true
serde_json.workspace = true

anyhow.workspace = true
clap.workspace = true
