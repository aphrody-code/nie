[package]
name = "nie-tasks"
description = "Orchestration de jobs asynchrones annulables/pausables avec progression — architecture inspirée de sd-task-system (spacedrive), implémentation originale pour niers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:async-trait", "dep:tokio", "dep:tracing", "dep:uuid"]

[dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"] }
async-trait = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4", "serde"] }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "test-util"] }
