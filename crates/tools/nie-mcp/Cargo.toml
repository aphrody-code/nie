[package]
name = "nie-mcp"
description = "Native Rust MCP stdio server for the complete niers tool surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "nie-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
nie-cli.workspace = true

[dev-dependencies]
# Le test RE réel corrobore les réponses du serveur contre la table `.pdata` du binaire de
# référence, lue indépendamment : c'est `nie-pe` qui la décode.
nie-pe.workspace = true
serde_json = { workspace = true, default-features = true }
