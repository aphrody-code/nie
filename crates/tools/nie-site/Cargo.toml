[package]
name = "nie-site"
description = "nie — serveur HTTP 100 % Rust (Axum 0.8) : bundle nie-web, /api/v1, espaces VFS /f et /b, proxy nie-model-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "nie_site"
path = "src/lib.rs"

[[bin]]
name = "nie-site"
path = "src/main.rs"

[[bench]]
name = "routing"
harness = false

[lints]
workspace = true

[dependencies]
# Le VFS du jeu : `open_game()`/`resolve_game_dir()` — la MÊME résolution que le reste du
# dépôt (aucun chemin machine compilé).
#
# Features par défaut (`std` + `lua`) PLUS `serde`. Ce qu'elles décident, mesuré :
# - `std` porte les huit parseurs géométriques (`g4pk`, `objbin`, `g4pkm`, `g4cm`, `col`,
#   `g4sk`, `mevbin`, `g4mt`), tous derrière `#[cfg(feature = "std")]` — 67 878 fichiers du
#   VFS, décodés EN PROCESS par `routes::geometrie`, sans une dépendance de plus ;
# - `serde` ne fait qu'ajouter des `derive` sur ces structures : c'est ce qui permet à
#   `?forme=complet` de rendre la structure décodée au lieu d'un `Debug` — un JSON public ne
#   se sérialise pas par `Debug` ;
# - `textures`, `images` et `audio-decode` restent ÉTEINTES : elles tireraient `image_dds`,
#   `image` et `cridecoder` dans un service web. Ces familles-là sont déléguées à l'amont, et
#   `/api/v1/formats` le dit au lieu de le promettre.
nie-formats = { workspace = true, features = ["serde"], default-features = true }
nie-explore = { workspace = true, features = ["host"] }

# Les 93 familles de donnees du jeu, derriere UNE facade : `nie_data::typed::decode_by_key`,
# deja partagee par `nie-model-serve` (route `/typed`) et `nie-wasm` (decodage in-browser).
# C'est la source unique — la brancher ici n'en cree pas une seconde.
#
# Ce que la matrice de couverture a chiffre le 2026-09-06 : 110 des 116 modules de `nie-data`
# etaient `manquant` — parseur ecrit, golden teste, aucune route. La facade en atteint 90.
#
# `serde` est REQUISE : `typed` est gate `#![cfg(feature = "serde")]` en entier, et sans elle
# le module n'existe pas — l'appel ne compile pas, il ne degrade pas.
nie-data = { workspace = true, features = ["serde", "std"] }

# La logique de JEU pure : courbe de statistiques a trois segments, tables de croissance
# reelles, comparaison des variantes d'un personnage, builds BASARA. Ecrite, testee, et servie
# par aucune route jusqu'ici — c'est ce que la matrice de couverture appelle `manquant`, et ce
# que `docs/inagle/05-service-et-types.md` § 5.4 classait deuxieme dans l'ordre qui fait tomber
# le plus de code TypeScript.
#
# Features PAR DEFAUT, c'est-a-dire `data` seule. Ce qu'elle decide, mesure :
# - `data` embarque les 4 vraies tables de croissance par `include_str!` (lv1=36, lv30=144,
#   main=48, sub=48) et donne `GrowthTables::load_embedded()`. Sans elle, la route de stats
#   n'aurait aucune table a interroger et rendrait des blocs a zero en annoncant un succes ;
# - la feature `serde` de `nie-core` reste ETEINTE, et c'est deliberé : elle derive
#   `Serialize` sur les types du moteur, donc elle publierait le nom des variantes Rust
#   (`"EvolutionHybride"`) dans un JSON public. `routes::regles` traduit chaque enum par un
#   `match` vers une chaine choisie — un champ public ne se serialise pas par son nom interne.
#   L'eteindre est donc une garantie, pas une economie : le derive ne peut pas etre invoque
#   par erreur.
nie-core.workspace = true

# Le pet Aphrody : atlas, animations et poses de regard, embarques au build par
# `include_bytes!`. Le site ne fait que republier ce package — il n'en garde aucune copie.
# Il porte aussi `assets::encoder_png`, le seul encodeur PNG du site (cf. `routes::modeles3d`).
nie-aphrody.workspace = true
# Les surfaces et jetons typés du jeu : la SSR doit partager exactement la même source que
# `packages/inacord-ui`, pas recopier une couleur ou un angle dans ses templates.
nie-ui.workspace = true

# Le rendu 3D du moteur : `glb::parse` + `render::render`, le rasteriseur CPU a z-buffer qui
# sert de verite terrain aux goldens. C'est ce que l'amont ne sait PAS faire — il assemble des
# GLB, il n'en fait pas d'image. Features par defaut (`gpu` eteinte) : le site rend en
# logiciel, et tirer wgpu dans un service sans pilote graphique n'aurait aucun sens.
nie-render3d.workspace = true
# Pour son SEUL selecteur de chemins (`nie_viola::Filtre`) : la syntaxe glob du jeu, portee de
# `DumpService.GlobToRegex` et deja testee. La reecrire ici donnerait une seconde syntaxe, qui
# divergerait de celle des presets de dump au premier motif tordu.
nie-viola.workspace = true

# Shared bytecode decoding and bounded trusted-VFS menu replay. Arbitrary evaluation is not routed.
nie-lua = { workspace = true, features = ["vm"] }

# Save character identifiers are parsed by the type that owns their byte representation. The
# site never receives a save file: `/api/v1/save/roster` only normalizes the identifiers already
# extracted on the client, then resolves them against the read-only mirror.
nie-save.workspace = true

# Character catalogue queries belong to the wiki data library. The HTTP route preserves its
# existing DTO while delegating filtering, faceting, ordering and pagination to this crate.
nie-wiki.workspace = true
# Portable existing encyclopedia matcher; no network ingestion feature.
nie-zukan.workspace = true

# Serveur HTTP. Seul ajout réel au workspace (cf. docs/stack/dependencies.md) : 0.8.9, jamais
# 0.8.2 (yanked). Syntaxe de route 0.8 : `{param}` et `{*wildcard}` — l'ancienne PANIQUE.
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri"] }
# `net`/`signal`/`fs`/`io-util` s'ajoutent aux features du workspace (rt, rt-multi-thread,
# sync, macros, time) : les features cargo sont additives.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "signal", "fs", "io-util"] }
tower = { workspace = true, features = ["util", "limit"] }
tower-http = { workspace = true, features = ["trace", "timeout"] }
http-body-util.workspace = true
bytes.workspace = true

# Templates compilés. `askama_axum` est mort et il n'existe pas de feature `with-axum` :
# on rend en `String` et on construit la réponse à la main (cf. `routes::pages`).
askama.workspace = true

# Cache asynchrone à TTL et poids. Plancher 0.12.16 : en deçà, `EvictionPolicy::lru()`
# pouvait figer l'éviction définitivement.
moka = { workspace = true, features = ["future"] }
# ETag fort : blake3 est ~3× plus rapide que sha2 sur les gros corps, et `to_hex()` n'alloue pas.
blake3.workspace = true

# Client vers nie-model-serve. Localhost en clair : aucune pile TLS n'entre dans la crate
# (nginx termine le TLS). `default-features = false` ⇒ ni native-tls ni rustls.
# La feature `rustls` a ete ajoutee le 2026-09-07 : le client ne parlait qu'a `nie-model-serve`
# sur `http://127.0.0.1`, donc sans TLS, et la route `/downloads/inacord/latest.json`
# doit joindre `https://api.github.com`. Sans lui, l'appel echoue en « injoignable »,
# ce qui se lit comme une panne de reseau au lieu d'un binaire sans autorite de
# certification. Racines webpki plutot que celles du systeme : elles sont dans le
# binaire, donc insensibles a `ProtectSystem=strict` et a une derive du magasin local.
reqwest = { workspace = true, features = ["http2", "rustls"] }

# Lecture seule des gisements (var/mirror.sqlite). Version du lock (0.37) : le bump vers 0.40
# est un lot de workspace, pas une décision de cette crate.
rusqlite = { workspace = true, features = ["bundled"] }
parking_lot.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
thiserror.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "color", "env"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
