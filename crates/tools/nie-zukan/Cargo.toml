[package]
name = "nie-zukan"
description = "Level-5 Inagle encyclopedia ingestion, parsing, and matching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:clap",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:tracing-subscriber",
]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
tracing.workspace = true
# Central pin narrows ^0.3 to =0.3.22; the existing unified lock already selects 0.3.22.
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }

# HTTP + HTML
# Central minimum narrows ^0.13 to ^0.13.4; the existing unified lock already selects 0.13.4.
reqwest = { workspace = true, default-features = true, features = ["blocking"], optional = true }
scraper.workspace = true

# encodage
base64.workspace = true
percent-encoding.workspace = true
# Crate 100 % SYNCHRONE (reqwest::blocking + std::thread::sleep) — pas de runtime async.

[[bin]]
name = "nie-zukan"
path = "src/bin/nie_zukan.rs"
required-features = ["host"]
