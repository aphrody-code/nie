[package]
name = "nie-zukan"
description = "Level-5 Inagle encyclopedia ingestion, parsing, and matching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:clap",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:tracing-subscriber",
]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4", features = ["derive", "color", "env"], optional = true }
rusqlite = { workspace = true, optional = true }

# HTTP + HTML
reqwest = { version = "0.13", features = ["blocking"], optional = true }
scraper = "0.22"

# encodage
base64 = "0.22"
percent-encoding = "2"
# Crate 100 % SYNCHRONE (reqwest::blocking + std::thread::sleep) — pas de runtime async.

[[bin]]
name = "nie-zukan"
path = "src/bin/nie_zukan.rs"
required-features = ["host"]
