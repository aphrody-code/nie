[package]
name = "nie-bench"
description = "Banc d'essai inter-langages : mesure les hot paths du dépôt en Rust, et produit les échantillons que les harnais C++/C#/TS rejouent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-bench"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
host = ["dep:anyhow", "dep:clap"]

[lints]
workspace = true

[dependencies]
nie-formats.workspace = true
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
