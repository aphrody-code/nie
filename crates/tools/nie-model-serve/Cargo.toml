[package]
name = "nie-model-serve"
description = "Portable IEVR model catalogs and menu compositor with an optional live GLB HTTP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-model-serve"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
# Filesystem, SQLite, TCP, tracing and CLI bindings. The reusable catalog and menu-rendering
# library stays available with `--no-default-features`, including on wasm32.
host = [
    "dep:anyhow",
    "dep:clap",
    "dep:nie-data",
    "dep:nie-explore",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:sha2",
    "dep:tracing",
    "dep:tracing-subscriber",
    "nie-formats/audio-decode",
    "nie-formats/images",
]
# Active les tests de décodage audio sur les vrais fichiers AWB/HCA IEVR (non distribués).
# Convention identique à `real-saves` (nie-save) et `real-fixtures` (nie-formats).
# Lancer : cargo test -p nie-model-serve --features real-audio
real-audio = ["host"]

[lints]
workspace = true

[dependencies]
# Features : `textures` = décodeur G4TX/DDS partagé (`nie_formats::g4tx_decode`) ;
# `audio-decode` = décodeur audio HCA/ADX/AWB/ACB partagé (`cri_audio::decode_to_wav`).
nie-formats = { path = "../../engine/nie-formats", default-features = false, features = ["std", "serde", "textures"] }
# Parseurs typés des familles game-data (formation, skill, item, mission…) :
# alimentent la route `/typed` qui décode un cfg.bin en structures de jeu nommées.
nie-data = { path = "../../engine/nie-data", features = ["serde"], optional = true }
# Vue « dossier » du VFS, rôles de dossiers et table des formats d'export : la MÊME logique que
# celle qu'utilise l'app desktop (`vfs_ls`), exposée ici en JSON pour que l'explorateur web
# d'azalée lise le vrai VFS au lieu d'un index SQLite figé régénéré à la main.
nie-explore = { path = "../../engine/nie-explore", optional = true }
# (cridecoder arrive via nie-formats feature `audio-decode` — plus de dép directe)
anyhow = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
# Empreinte SHA-256 du GLB servi, citée dans chaque rapport d'assemblage.
sha2 = { workspace = true, optional = true }

[[example]]
name = "diag_g4pkm_transforms"
required-features = ["host"]

[[example]]
name = "probe_g4tx_dds"
required-features = ["host"]

[dev-dependencies]
# Example `probe_g4tx_dds` réfère l'enum `ImageFormat` en direct (le décodage applicatif
# passe par nie_formats::g4tx_decode, mais cette cible de dev nomme l'enum).
image_dds = { version = "0.7", default-features = false }
