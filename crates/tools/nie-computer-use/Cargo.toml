[package]
name = "nie-computer-use"
description = "Native, bounded Computer Use probes for nie.exe and Ghidra."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
# Filesystem/SQLite validation and live process probes are native bindings. The
# offline image inspector remains available without this feature, including on
# `wasm32-unknown-unknown`.
host = ["dep:rusqlite", "nie-re/host", "nie-trace/host"]

[dependencies]
anyhow.workspace = true
hex.workspace = true
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
nie-re.workspace = true
nie-trace.workspace = true

[dev-dependencies]
nie-index = { workspace = true, default-features = true }

[[example]]
name = "verify_session"
required-features = ["host"]
