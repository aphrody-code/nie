[package]
name = "nie-steam"
description = "Acquisition Steam native (download/dump des depots IEVR) en Rust pur, sur steamroom — port du Steam/ C# d'iecode (remplace SteamKit2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:anyhow",
    "dep:base64",
    "dep:clap",
    "dep:dirs-next",
    "dep:regex",
    "dep:serde_json",
    "dep:steamroom",
    "dep:steamroom-client",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zip",
]

[dependencies]
steamroom = { version = "0.2", optional = true }
steamroom-client = { version = "0.2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
regex = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
# Nécessaire pour TokenStore (default_path) et decompress_if_zipped (manifest CDN).
dirs-next = { version = "2", optional = true }
zip = { version = "2", optional = true }
clap = { version = "4", features = ["derive", "color", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nie-steam"
path = "src/bin/nie_steam.rs"
required-features = ["host"]
