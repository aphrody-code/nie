[package]
name = "nie-steam"
description = "Acquisition Steam native (download/dump des depots IEVR) en Rust pur, sur steamroom — port du Steam/ C# d'iecode (remplace SteamKit2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:anyhow",
    "dep:base64",
    "dep:clap",
    "dep:dirs-next",
    "dep:regex",
    "dep:serde_json",
    "dep:steamroom",
    "dep:steamroom-client",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zip",
]

[dependencies]
steamroom = { workspace = true, optional = true }
steamroom-client = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true, default-features = true }
thiserror.workspace = true
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# Nécessaire pour TokenStore (default_path) et decompress_if_zipped (manifest CDN).
dirs-next = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
# Central pin narrows ^0.3 to =0.3.22; the existing unified lock already selects 0.3.22.
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "nie-steam"
path = "src/bin/nie_steam.rs"
required-features = ["host"]
