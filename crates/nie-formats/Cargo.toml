[package]
name = "nie-formats"
description = "Parsers de formats Level-5 (CPK, cfg.bin, G4*, CriLayla, Criware) portés en Rust no_std-friendly pour niers headless + wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
aes.workspace = true

[features]
default = []
serde = ["dep:serde"]
# Active les tests golden adossés à des fragments RÉELS du jeu (copyright Level-5),
# non distribués : ils vivent en local sous `crates/nie-formats/tests/fixtures/`
# (gitignoré). Off par défaut → un clone public compile et teste sans ces données.
real-fixtures = []
