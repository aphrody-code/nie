[package]
name = "nie-formats"
description = "Parsers de formats Level-5 (CPK, cfg.bin, G4*, CriLayla, Criware) portés en Rust no_std-friendly pour niers headless + wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
aes.workspace = true
# Décodage des textures DDS/BCn — feature `textures` uniquement (off par défaut).
# `default-features = false` = décodeur pur Rust, compatible no_std/wasm32.
image_dds = { version = "0.7", default-features = false, optional = true }
png = { version = "0.18", optional = true }

[features]
default = []
serde = ["dep:serde"]
# Décodeur G4TX/DDS → RGBA8/PNG unique du workspace (module `g4tx_decode`). Tire `image_dds`
# (std) : gardé off par défaut pour préserver le build no_std/wasm de `nie-formats`.
textures = ["dep:image_dds", "dep:png"]
# Active les tests golden adossés à des fragments RÉELS du jeu (copyright Level-5),
# non distribués : ils vivent en local sous `crates/nie-formats/tests/fixtures/`
# (gitignoré). Off par défaut → un clone public compile et teste sans ces données.
real-fixtures = []

[dev-dependencies]
# Encodage PNG pour les examples/tests (atlas, anim, scène de dialogue) — indépendant
# de la feature `textures` (qui ne gate que le décodeur DDS de la lib).
png = "0.18"
