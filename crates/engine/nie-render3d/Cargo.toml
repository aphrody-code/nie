[package]
name = "nie-render3d"
description = "Renderer 3D du moteur niers : charge un GLB réel (assets CPK) et le rend en perspective (rastérisation CPU z-buffer + éclairage) → PNG/MP4 turntable, headless"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-render3d"
path = "src/main.rs"
# La bibliothèque ne dépend pas d'un analyseur d'arguments : c'est ce qui la rend embarquable
# dans un module WebAssembly, où `clap` ne serait que du poids mort dans le budget d'octets.
required-features = ["cli"]

[lints]
workspace = true

[dependencies]
nie-core.workspace = true
anyhow.workspace = true
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
serde_json = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
png.workspace = true
bcdec_rs.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
nie-formats = { workspace = true, default-features = true }

# Rendu GPU (wgpu) du viewport — optionnel : les consommateurs headless (golden CPU, CLI turntable)
# ne doivent pas tirer wgpu/pollster. Version de wgpu ALIGNÉE sur `nie-game` (=29.0.3), l'autre hôte
# GPU du workspace : deux versions majeures de wgpu dans un même binaire dupliqueraient le backend.
[features]
default = ["cli"]
# L'exécutable en ligne de commande. Séparé pour que `nie-wasm` puisse embarquer le rastériseur
# CPU sans embarquer `clap`.
cli = ["dep:clap"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Présentation canvas facultative ; aucun backend GPU ajouté aux consommateurs CPU par défaut.
# RÉSULTAT NÉGATIF MESURÉ, 2026-09-12 : ajouter `wgpu/webgl` ici ferait tourner le MÊME renderer
# Rust sur WebGL 2, ce qui rendrait supprimables les 445 lignes de
# `apps/nie-web/src/avatar/webgl-viewer.ts` — une seconde implémentation qui dérive par
# construction. Le module passe alors de 4 518 833 à 6 865 774 octets, soit +2,24 Mio, et dépasse
# de 574 318 octets le budget de 6 Mio que `apps/nie-web/scripts/build-wasm.ts` impose. Ce budget
# protège le téléchargement de CHAQUE visiteur, pas seulement de ceux qui ouvrent un modèle : la
# migration attend un module chargé à la demande, pas un relèvement du plafond.
webgpu = ["gpu", "wgpu/webgpu", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true, features = ["HtmlCanvasElement"] }
