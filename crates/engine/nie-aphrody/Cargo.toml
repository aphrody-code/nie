[package]
name = "nie-aphrody"
description = "Runtime typé du pet Codex Aphrody v2 : atlas RGBA, animations et directions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Le dossier du jeu (`gisement`) parse chara_param, skill_config et aura_skill_config : ces
# parseurs vivent dans nie-data, et il n'y a pas de cycle — nie-data n'importe pas cette crate.
nie-data = { workspace = true, features = ["serde", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
png = "0.18"


[[bin]]
name = "export_aphrody"
path = "src/bin/export_aphrody.rs"

[[bin]]
name = "export_assets"
path = "src/bin/export_assets.rs"
