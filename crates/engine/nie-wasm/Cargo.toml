[package]
name = "nie-wasm"
description = "Bindings WebAssembly pour le savoir niers vérifié : nie-formats (detect/CRILAYLA/@UTF/G4*), nie-core (stats growth + FSM de match) et nie-data (lookup skill/aura/item) exposés au navigateur via wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# cdylib pour wasm-bindgen ; rlib pour que `cargo build --workspace` (natif) reste vert.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Features : `textures` = décodeur G4TX/DDS partagé (`nie_formats::g4tx_decode`) ;
# `audio-decode` = décodeur audio HCA/ADX/AWB/ACB partagé (`cri_audio::decode_to_wav`).
# `image_dds`/`png`/`cridecoder` arrivent transitivement (pur Rust, compatibles wasm32).
nie-formats = { workspace = true, features = ["serde", "textures", "audio-decode"], default-features = true }
# nie-core (calcul de stats/growth + machine à états de match) et nie-data (lookup
# skill/aura/item) avec la feature `serde` pour sérialiser les résultats en JSON côté
# navigateur. Déclarés en path direct : ces deux crates ne sont pas (encore) dans la
# `[workspace.dependencies]` racine.
nie-core = { workspace = true, features = ["serde"] }
nie-data = { workspace = true, features = ["serde"] }
nie-save = { workspace = true, features = ["serde"] }
# Le rendu 3D des VRAIS modèles du jeu. `default-features = false` retire `clap` (l'exécutable)
# et laisse le rastériseur CPU pur Rust : aucun GPU requis, et c'est exactement le code dont les
# tests golden natifs vérifient la sortie.
nie-render3d.workspace = true
# Decodeur de bytecode Lua 5.2 SANS la VM : `default-features = false` retire mlua (Lua
# vendored en C), qui ne se construit pas pour wasm32. Le module `bytecode` est pur Rust.
nie-lua.workspace = true
# nie-app : le JEU jouable (FSM GameState + rendu CPU framebuffer). Cœur wasm-safe
# (l'I/O assets est gatée hors wasm) → expose `WasmGame` pour le canvas navigateur.
nie-app.workspace = true
# `nie-runtime` provides the deterministic local match simulation and top-down renderer exposed by
# `WasmMatch`; it is not the native executable's match engine. `nie-render3d` follows separately.
nie-runtime.workspace = true
# Camera state, projection/view matrices and the verified interpolation controller are pure
# Rust. Host process memory and SQLite tooling stay excluded from the browser dependency graph.
nie-camera.workspace = true
# Shared VFS content dispatcher. Native filesystem search and the Lua VM remain behind
# nie-explore's disabled `host` feature; browser bytes use the same portable parsers as the CLI.
nie-explore.workspace = true
# Pure-Rust PE/ELF triage used to inspect a user-supplied executable entirely in the browser.
aphrody-re.workspace = true
# Pure-Rust MSVC-dialect x86-64 assembler used by the browser inspection/forge surface.
nie-asm.workspace = true
# Byte-exact executable comparison from the PE forge, without its optional serde surface.
nie-pe.workspace = true
# Bounded x86-64 lifting and blocker diagnostics from the executable forge. Database-backed
# reference storage stays outside the browser through the disabled `redb` feature.
nie-forge.workspace = true
# Safe in-memory minidump parsing; the browser wrapper exposes metadata only and never copies
# captured process memory back into JavaScript.
nie-dump.workspace = true
# Detailed, bounded PE/COFF section/import/export inspection over uploaded bytes.
ievr-tools.workspace = true
# Portable `.pdata` inspection; SQLite/Redis propagation and host dump recovery stay disabled.
nie-re.workspace = true
# Portable AOB scanning only; live process memory and patching remain behind the host feature.
nie-trace.workspace = true
# Pure official-encyclopedia matching; network, SQLite and CLI dependencies stay host-only.
nie-zukan.workspace = true
# Validated format-catalog parsing; database/path ingestion remains behind the host feature.
nie-seed.workspace = true
# Portable task lifecycle snapshots; Tokio workers and UUID generation stay host-only.
nie-tasks.workspace = true
# Deterministic in-memory BFS frontier; the shared Redis backend remains host-only.
nie-queue.workspace = true
# Credential-free depot selection/collision planning; Steam network and filesystem access stay host-only.
nie-steam.workspace = true
# Deterministic, bounded cross-language benchmark samples; clocks and filesystem harnesses stay host-only.
nie-bench.workspace = true
# Bounded offline image address/range inspection; process, SQLite and network probes stay host-only.
nie-computer-use.workspace = true
# Deterministic search over caller-owned reverse-engineering knowledge; SQLite and Redis stay host-only.
nie-index.workspace = true
# Canonical detailed format inspection extracted from the headless CLI binding.
nie-headless.workspace = true
# Portable validated scene editing and bounded undo/redo; native GUI/GPU bindings stay host-only.
nie-editor.workspace = true
# Bounded T2B character/model catalogs extracted from the HTTP binding.
nie-model-serve.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
# (cridecoder arrive via nie-formats feature `audio-decode` — plus de dép directe)

# wasm-bindgen est épinglé à une version EXACTE dans le Cargo.toml racine : le CLI
# `wasm-bindgen` doit porter la même, sinon les bindings générés sont rejetés.
# Gate via cfg(target_arch = "wasm32") dans le code source.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-time.workspace = true
parking_lot.workspace = true


# getrandom avec feature "js" : requis si une dep transitive l'utilise sur wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
web-sys = { workspace = true, optional = true, features = ["HtmlCanvasElement"] }

[features]
default = []
# Présentation WebGPU du viewport 3D. Le rastériseur CPU, lui, n'est derrière AUCUNE feature :
# c'est le seul rendu 3D qu'un moteur sans WebGPU puisse faire, et c'est celui dont la sortie
# est vérifiée par les tests golden natifs de `nie-render3d`.
webgpu = ["nie-render3d/webgpu", "dep:web-sys"]
