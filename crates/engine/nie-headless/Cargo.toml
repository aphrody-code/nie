[package]
name = "nie-headless"
description = "Runner CLI headless : détecte un format IEVR et affiche un résumé JSON sans moteur Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-headless"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
host = ["dep:clap", "dep:nie-core", "dep:nie-data"]

[lints]
workspace = true

[dependencies]
nie-formats = { workspace = true, default-features = true }
nie-data = { workspace = true, optional = true }
nie-core = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive", "color", "env"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
serde_json = { workspace = true, default-features = true }
