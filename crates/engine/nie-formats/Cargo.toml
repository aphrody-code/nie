[package]
name = "nie-formats"
description = "Parsers de formats Level-5 (CPK, cfg.bin, G4*, CriLayla, Criware) portés en Rust no_std-friendly pour niers headless + wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# (thiserror retiré, Phase 3 : FormatError/AssembleError implémentent core::error::Error à la main → no_std-ready)
serde = { workspace = true, optional = true }
serde_json.workspace = true
aes.workspace = true
# Décodage des textures DDS/BCn — feature `textures` uniquement (off par défaut).
# `default-features = false` = décodeur pur Rust, compatible no_std/wasm32.
image_dds = { version = "0.7", default-features = false, optional = true }
png = { version = "0.18", optional = true }
# Décodage HCA chiffré (feature `audio-decode` uniquement, off par défaut).
# `default-features = false` = pur Rust, compatible wasm32 (nie-wasm le prouve).
cridecoder = { workspace = true, optional = true }

[features]
# `default = ["std"]` → build par défaut = crate std (consommateurs INCHANGÉS).
# `--no-default-features` → `#![no_std]` strict (cœur de parseurs alloc-only, pour nie-data).
default = ["std"]
std = []
serde = ["dep:serde"]
# Décodeur G4TX/DDS → RGBA8/PNG unique (module `g4tx_decode`). Tire `image_dds` (std) → implique `std`.
textures = ["std", "dep:image_dds", "dep:png"]
# Décodeur audio Criware → WAV (HCA + ADX/AWB/ACB) — source unique (cri_audio::decode_to_wav).
# Tire `cridecoder` (std::io) → implique `std`.
audio-decode = ["std", "dep:cridecoder"]
# Tests golden sur fragments RÉELS (copyright Level-5, gitignoré). Chargent via std::fs → implique `std`.
real-fixtures = ["std"]

# `model_glb_preview` appelle `g4tx_decode`, qui vit derrière la feature `textures`.
# Sans cette déclaration, `cargo test -p nie-formats` (features par défaut) échoue à compiler
# l'exemple — le workspace complet le masquait en unifiant les features.
[[example]]
name = "model_glb_preview"
required-features = ["textures"]

[dev-dependencies]
# Encodage PNG pour les examples/tests (atlas, anim, scène de dialogue) — indépendant
# de la feature `textures` (qui ne gate que le décodeur DDS de la lib).
png = "0.18"
