[package]
name = "nie-app"
description = "Cœur du jeu niers : la machine à états (GameState) + le rendu abstrait (trait Renderer), extraits en bibliothèque réutilisable. nie-play (headless/golden) et nie-game (interactif GPU) en sont deux front-ends. Câble match nie-core, dialogues + police nie-formats, perso 3D nie-render3d."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde_json = { workspace = true, default-features = true }
nie-formats = { workspace = true, features = ["serde"], default-features = true }
nie-render3d.workspace = true
nie-core.workspace = true
nie-data = { workspace = true, features = ["serde", "std"] }
# Moteur de match (World : physique ballon, 22 joueurs, buts) pour la FSM interactive `flow::Screen`
# (relocalisée depuis nie-wasm, Phase 5). Lib seulement (pas les bins ffmpeg) → wasm-compatible.
nie-runtime.workspace = true
# `Vec2` traverse l'API du moteur (direction de l'entrée de jeu) : le type doit être nommable ici.
nie-geom.workspace = true
bcdec_rs.workspace = true

[dev-dependencies]
# Encodage PNG des exemples (rendu 3D de match) — pas une dependance de la bibliotheque.
png.workspace = true
