[package]
name = "nie-play"
description = "Front-end HEADLESS/GOLDEN du jeu niers : exécute la machine à états de nie-app via un flow scripté + un Renderer CPU, et écrit le playthrough en PNG/MP4 déterministes. Le match vient de la vraie FSM nie-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-play"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "color", "env"] }
png.workspace = true
nie-app.workspace = true
nie-formats = { workspace = true, default-features = true }
nie-core.workspace = true
nie-runtime.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
