[package]
name = "nie-explore"
description = "Moteur partagé d'aperçu/description des entrées VFS (CPK) par format — utilisé par `niers vfs cat` (nie-cli) et l'app desktop `nie-explorer` (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
nie-formats = { workspace = true, features = ["serde", "textures", "images", "audio-decode"] }
# Introspection best-effort des scripts `.lua.bin` (VM Lua 5.2 réelle, mlua vendored) —
# stubs tous les globals hôtes et collecte ceux référencés, sans jamais exécuter la vraie
# logique moteur (cf. `nie_lua::discover_host_calls`).
nie-lua = { path = "../../engine/nie-lua" }
# Pont générique T2B/RDBN → JSON (forme "entries"/"lists" des dumps inagle) qui débloque LES
# ~100 parseurs spécialisés de nie-data (chara_base/chara_text/skill/growth/item/aura/…) contre
# les octets VFS LIVE, sans dump externe : ils consomment tous la même forme `&serde_json::Value`.
nie-data = { path = "../../engine/nie-data", features = ["serde", "std"] }
# Le catalogue des cinématiques (`cinema`) est un DTO partagé par la CLI, le serveur HTTP et
# la page /videos d'azalée : il doit se sérialiser à l'identique des trois côtés.
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
