[package]
name = "nie-queue"
description = "Bounded deduplicated BFS frontiers for the niers reverse-engineering loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
# Redis and host diagnostics are native integrations. The bounded in-memory BFS planner remains
# available without them, including on wasm32.
host = ["dep:redis", "dep:thiserror", "dep:tracing"]

[dependencies]
redis = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
