[package]
name = "nie-seed"
description = "Import du savoir fusionné (index Ghidra nie-index.json, RTTI, formats iecode, hash→nom inagle) comme ancres de la boucle RE niers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
host = [
    "dep:anyhow",
    "dep:nie-index",
    "dep:rusqlite",
    "dep:tracing",
]

[dependencies]
nie-index = { workspace = true, optional = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
thiserror.workspace = true
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
