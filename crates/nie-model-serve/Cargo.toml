[package]
name = "nie-model-serve"
description = "Serveur HTTP live d'assemblage GLB IEVR (corps+face+uniforme depuis CPK, cache disque)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-model-serve"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nie-formats = { path = "../nie-formats", features = ["serde"] }
nie-wiki = { path = "../nie-wiki" }
cridecoder.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
# Décodage DDS (BC1/BC3/BC5/BC7) → RGBA pour les textures G4TX (face + uniforme)
image_dds = { version = "0.7", default-features = false }
# Encodage RGBA → PNG pour l'embed dans le GLB
png = "0.18"
