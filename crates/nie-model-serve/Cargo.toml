[package]
name = "nie-model-serve"
description = "Serveur HTTP live d'assemblage GLB IEVR (corps+face+uniforme depuis CPK, cache disque)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-model-serve"
path = "src/main.rs"

[features]
# Active les tests de décodage audio sur les vrais fichiers AWB/HCA IEVR (non distribués).
# Convention identique à `real-saves` (nie-save) et `real-fixtures` (nie-formats).
# Lancer : cargo test -p nie-model-serve --features real-audio
real-audio = []

[lints]
workspace = true

[dependencies]
nie-formats = { path = "../nie-formats", features = ["serde"] }
# Parseurs typés des familles game-data (formation, skill, item, mission…) :
# alimentent la route `/typed` qui décode un cfg.bin en structures de jeu nommées.
nie-data = { path = "../nie-data", features = ["serde"] }
cridecoder.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
# Décodage DDS (BC1/BC3/BC5/BC7) → RGBA pour les textures G4TX (face + uniforme)
image_dds = { version = "0.7", default-features = false }
# Encodage RGBA → PNG pour l'embed dans le GLB
png = "0.18"
