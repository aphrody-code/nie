[package]
name = "nie-play"
description = "Jeu intégré niers : machine à états (Titre → Menu → Match → Histoire) câblant les systèmes reversés (match nie-core, dialogues + police nie-formats, données nie-data) en UN binaire jouable headless → playthrough PNG/MP4."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nie-play"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
png = "0.18"
nie-core = { path = "../nie-core" }
nie-data = { path = "../nie-data" }
nie-formats = { path = "../nie-formats", features = ["serde"] }
nie-render3d = { path = "../nie-render3d" }
bcdec_rs = "0.2.0"
