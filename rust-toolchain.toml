# Pin the current patched stable toolchain. The workspace uses no unstable language feature, and
# the former external aphrody-re path dependency is now owned in-tree. Stable keeps native and
# Wasm releases reproducible without coupling this repository to a dated nightly snapshot.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
