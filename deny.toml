[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Transitive through steamroom; niers performs local Steam authentication and does not expose RSA private-key operations to network timing observers. No patched rsa 0.9 release exists." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  { crate = "tar@<0.4.45", reason = "CVE-2026-33056 permits directory permission tampering during Cargo extraction." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/modelcontextprotocol/rust-sdk.git",
]
