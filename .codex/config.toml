# Reglages Codex du depot. Ce fichier est VERSIONNE et partage entre le poste Windows
# et le VPS : il ne doit porter aucun chemin machine. Il en portait un — BASH_ENV pointait
# sur C:/Users/aphro/nie/.claude/shell-init.sh, mort depuis que le depot a ete renomme
# `nie` -> `nie`. Un BASH_ENV introuvable ne leve rien : bash demarre simplement sans
# `set -o pipefail`, et un `| tail` rend 0 sur une preuve rouge (cf. CLAUDE.md, § Le shell).
#
# `inherit = "all"` et non "core" : sur le POSTE WINDOWS, NIE_GAME_DIR et NIE_REPO sont
# des variables d'environnement UTILISATEUR (verifiees avec
# [Environment]::GetEnvironmentVariable('NIE_GAME_DIR','User')). Le noyau "core" ne
# transmet que HOME/PATH/USER et consorts : il les aurait coupees, et chaque `nie`
# lance depuis Codex aurait monte un VFS vide en se portant bien. Les motifs d'exclusion
# par defaut de Codex (*KEY*, *TOKEN*, *SECRET*) restent actifs.
#
# NIE_GAME_DIR et NIE_REPO ne sont pas fixes ici, expres : ce sont des chemins machine.
# Cote Windows ils viennent des variables utilisateur, cote VPS de ~/.bashrc.

[shell_environment_policy]
inherit = "all"

[shell_environment_policy.set]
BASH_ENV = ".claude/shell-init.sh"

# The former nie-game server (nie-mcp) is reached through aphrody-mcp as the nie.* tool
# family (process boundary: aphrody-mcp spawns nie-mcp from PATH or NIE_MCP_BIN).

# aphrody-mcp — binaire Rust unique (crate aphrody-mcp du depot frere
# github.com/aphrody-code/aphrody-ai, installe via `cargo install --path
# crates/aphrody-mcp` -> ~/.cargo/bin, donc pas de chemin machine ici) :
# 42 outils (RE triage, recon reseau, voix, docs Context7/MS Learn, Gemini
# web, Adobe Firefly/Photoshop). Cf. plugins/aphrody/.claude-plugin/plugin.json
# dans le depot aphrody-os pour le detail des outils.
[mcp_servers.aphrody]
command = "aphrody-mcp"
args = []
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

# Les plugins sont actives DEPUIS LE DEPOT QU ILS SERVENT, jamais globalement : preuve
# mesuree le 2026-09-06 — `codex plugin list` rend `enabled` depuis C:\Users\aphro\nie
# et `disabled` depuis C:\Users\aphro, avec le meme reglage global a false.
[plugins."aphrody@aphrody-os"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = false

[plugins."modern-web-guidance@claude-plugins-official"]
enabled = false
