# Blender Extensions manifest (Blender >=4.2) for `niers`, in `plugins/niers-blender`.
# `niers_bridge.py` searches files/chara/waza through the VFS and the local SQLite mirror.
# G4 decoding (G4MD/G4MG/G4SK/G4MT/G4PKM parsers) comes from Bobi's upstream project
# (github.com/The-RealBobi/G4_Blender), credited below.
#
# Local modernization of an upstream addon with no declared license (`license` on GitHub is null
# and no LICENSE file exists). Redistribution and modification are authorized by the niers project
# owner (see `NIERS_VENDORING_NOTE.md`). The GPL-3.0-or-later declaration follows Blender's addon
# ecosystem convention for substantial `bpy` code and does not assert the upstream author's intent.
#
# Reference schema: https://docs.blender.org/manual/en/latest/advanced/extensions/getting_started.html
# and https://developer.blender.org/docs/features/extensions/api_listing/v1/.

schema_version = "1.0.0"

id = "niers"
version = "1.1.0"
name = "niers"
tagline = "Level-5 G4 assets (Inazuma Eleven VR) + VFS/wiki search"
maintainer = "niers — upstream G4 decoding by Bobi (github.com/The-RealBobi/G4_Blender)"
type = "add-on"
website = "https://github.com/aphrody-code/nie"

tags = [
	"Import-Export",
	"Animation",
	"Rigging",
]

# Extensions are available from 4.2; the code also supports the legacy addon format
# (the old bl_info is retained in parallel; see `__init__.py`).
blender_version_min = "4.2.0"

license = [
	"SPDX:GPL-3.0-or-later",
]
copyright = [
	"2026 Bobi",
]

# No third-party wheels: dependencies are Python's standard library plus bpy/mathutils supplied by
# Blender. Wiki queries run through the Rust `niers` CLI; this addon has no database or HTTP client.
# wheels = []

[permissions]
files = "Reads and writes G4MD/G4MG/G4SK/G4PKM plus the local wiki mirror"
network = "No network access; wiki queries use the local Rust CLI"

[build]
# Exclude development artifacts from the extension package (tests, Python cache, documentation
# images). This does not affect direct development imports through `sys.path`.
#
# The key is `paths_exclude_pattern` (gitignore-like syntax). Blender silently ignores
# `paths_exclude_glob`.
#
# Declaring this key replaces Blender's default instead of extending it, so Git entries must be
# listed explicitly or they will be included in the ZIP.
paths_exclude_pattern = [
	"__pycache__/",
	"tests/",
	"img/",
	"*.pyc",
	".git",
	".gitattributes",
	".gitignore",
	"NIERS_VENDORING_NOTE.md",
]
