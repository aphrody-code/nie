# Préchargement du plugin de formats de jeu IEVR.
#
# Bun exécute ce script AVANT tout module utilisateur lors de `bun run` (et `bun test`).
# register.ts appelle Bun.plugin({ name: "nie-game-formats", setup }) une seule fois.
# Après ça, tout `import` de .g4tx / .cfg.bin / .objbin / .g4pkm / .lip / .mev / .g4md
# est intercepté par les handlers onLoad sans configuration supplémentaire.
#
# Pour l'usage bundler, passer le plugin explicitement :
#   Bun.build({ plugins: [(await import("nie-plugin/register")).default] })
preload = ["./packages/nie-plugin/src/register.ts"]

[install]
linker = "isolated"       # pnpm-style strict node_modules

[install.scopes]
# @rose-griffon/* (types/db/ui, écosystème azalee) — registre privé GitHub Packages,
# restreint (publishConfig.access="restricted"). Token via $GH_PACKAGES_TOKEN (.env.local,
# gitignoré — jamais commité). N'installer QUE ce qui est sûr pour une app desktop distribuée :
# @rose-griffon/types (schémas/types purs) oui ; @rose-griffon/db (client Supabase, expose des
# clés service-role côté serveur) et @rose-griffon/ui (dépend de db) volontairement écartés
# ici, cf. commentaire dans apps/nie-explorer.
"@rose-griffon" = { token = "$GH_PACKAGES_TOKEN", url = "https://npm.pkg.github.com/" }

[test]
preload = ["./packages/nie-plugin/src/register.ts"]
coverage = false

[run]
silent = false
