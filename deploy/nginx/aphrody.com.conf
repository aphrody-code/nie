#
# Vhost de nie — REMPLACE `/etc/nginx/conf.d/aphrody.com.conf`.
#
# NE PAS INSTALLER DEPUIS UNE SESSION D'AGENT. Le `nginx -t` et le `reload` sont des actes
# de production (PLAN.md J5, proprietaire Codex, avec le go de l'utilisateur) :
#
#   sudo cp deploy/nginx/aphrody.com.conf /etc/nginx/conf.d/aphrody.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   for h in aphrody.com www api mcp downloads cdn nie bot admin bxc n2b; do
#       curl -sI "https://${h#aphrody.com}.aphrody.com/" | head -1
#   done
#
# ETAT MESURE LE 2026-09-07 (`ss -ltnp`), SUR CETTE MACHINE
# ---------------------------------------------------------
#   127.0.0.1:8085  nie-site          le site
#   127.0.0.1:8084  bxc-site          la vitrine bxc (depot `bxc`)
#   127.0.0.1:8790  nie-model-serve   le decodage a la demande
#   127.0.0.1:8808  serveur MCP       `mcp.aphrody.com`, 401 sans jeton
#   127.0.0.1:8083  RIEN              plus aucun processus
#
# Le releve du 2026-09-05 disait « les dix hotes pointent :8083 et rien n'y ecoute, donc
# 502 ». Ce n'est plus vrai : le bloc partage a ete repointe sur `:8084`, et les cinq hotes
# qu'il porte servent desormais la vitrine bxc. Consequence : **aucun de ces hotes n'est
# libre**, et le rollback « repointer sur :8083 » reste illusoire — il n'y a toujours pas de
# service a y retrouver. Le vrai rollback est de revenir a la version precedente de ce
# fichier, qui est dans l'historique git.
#
# La CSP `default-src 'none'` du bloc partage rend impossible tout site HTML+JS. Elle convient
# a des hotes qui ne servent qu'une vitrine statique ; elle empecherait nie de charger sa
# propre feuille de style. Le bloc du site n'en pose donc AUCUNE — `nie-site` pose la sienne,
# a douze directives, et deux CSP s'additionnent : la plus stricte gagne, et le resultat
# serait `'none'`.
#
# CE QUE CE FICHIER CHANGE
# ------------------------
#   nie.aphrody.com                :8790 nie-model-serve -> :8085 nie-site, LE SITE
#   aphrody.com, www.aphrody.com   :8085 -> 308 https://nie.aphrody.com$request_uri
#   api.aphrody.com                inchange : :8085 nie-site, API SEULE (404 ailleurs)
#   downloads. cdn. bot. admin. n2b. inchanges : :8084 bxc-site, CSP comprise
#   bxc.aphrody.com                sorti de ce fichier (`conf.d/bxc.aphrody.com.conf`)
#   mcp.aphrody.com                inchange, au caractere pres
#
# L'ORIGINE DU SITE EST `nie.aphrody.com`, PAS L'APEX
# ---------------------------------------------------
# Le site s'appelle `nie` et vit sur le sous-domaine du produit ; le nom `Aphrody` reste au
# depot `aphrody-code/aphrody`. L'apex et `www` ne portent plus de contenu et se contentent
# d'un 308 vers lui. Un 308 et non un 301 : la methode et le corps sont preserves, donc un
# POST vers l'apex n'est pas silencieusement transforme en GET. Les deux hotes gardent le
# HSTS — un redirecteur qui perd l'en-tete rouvre la fenetre en clair.
#
# `nie-model-serve` PERD SA FACADE PUBLIQUE, ET C'EST VOULU
# ---------------------------------------------------------
# Il occupait `nie.`, que le site prend. Aucun autre hote n'est libre : `downloads.`, `cdn.`,
# `bot.`, `admin.` et `n2b.` servent tous `bxc-site` sur `:8084` (mesure ci-dessus), et leur
# en prendre un couperait une vitrine en service. Ouvrir un `assets.aphrody.com` demanderait
# un enregistrement DNS et un certificat que celui-ci ne couvre pas.
#
# Le decodage reste donc joignable par `nie.aphrody.com/assets/*`, que `nie-site` proxifie
# **avec** ce que le service n'a pas : limite de debit, budget de temps, taille bornee, cache.
# C'est la regle que le dossier de decisions posait deja — « exposer `nie-model-serve` nu :
# jamais ; `nie-site` est obligatoire devant » — et la facade directe en etait l'exception.
#
# `api.` ne redirige PAS vers le site : il sert l'API et rien d'autre, en `noindex`, avec un
# `location / { return 404; }` — sans quoi deux origines rendraient le meme contenu, chacune
# avec son canonique.

# --- nie : le site lui-meme, sur `nie.aphrody.com` --------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nie.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # AUCUN `add_header Content-Security-Policy` ici : `nie-site` pose la sienne sur chaque
    # reponse, et deux CSP ne se remplacent pas — le navigateur applique l'intersection.
    # Aucun `X-Content-Type-Options` ni `Referrer-Policy` non plus, pour la meme raison : la
    # crate en pose cinq, et un en-tete duplique vaut au mieux un doublon, au pire un conflit.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Le bundle est deja pre-compresse a la construction (`br` et `zstd`, cote a cote du
    # fichier nu). `gzip on` ici recompresserait a la volee ce qui l'est deja mieux.
    gzip off;

    # Les fichiers du jeu peuvent etre gros ; la crate borne deja la taille cote amont.
    client_max_body_size 1m;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sans cela, nginx demande une reponse non compressee a l'amont et la sert telle
        # quelle : la pre-compression du bundle ne servirait jamais a personne.
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # Sonde publique. `nie-site` repond son nom et ses capacites mesurees, ce qui distingue
    # « le service tourne » de « le service peut repondre » — l'index du VFS se monte en
    # tache de fond, et `/healthz` le dit au lieu de le supposer.
    location = /health {
        proxy_pass http://127.0.0.1:8085/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# --- Limites de debit ------------------------------------------------------------------------
# Ce qui vit derriere `api.` DECODE a la demande : une texture coute ~100 ms, un modele
# assemble plusieurs secondes, un export video des dizaines. Mesure du 2026-09-05 : les 4
# workers d'alors de `nie-model-serve` etaient tous pris par des exports USM qui echouaient
# apres 20 a 40 secondes, et le service ne repondait plus a `/health` en 30 secondes. Il est
# passe a 8 workers, mais huit requetes lourdes simultanees suffiraient a le refermer.
#
# Un seul bloc les utilise aujourd'hui — `api.` — depuis que le decodage n'a plus de facade
# directe. Les zones restent declarees ici : `nie-site` pose sa propre borne par IP (cf.
# `crates/tools/nie-site/src/debit.rs`), et celle-ci est la seconde ligne, cote nginx.
limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

# --- Les cinq hotes de la vitrine bxc : inchanges, y compris leur CSP ------------------------
# `bxc.aphrody.com` n'est PLUS ici : il a son propre fichier (`conf.d/bxc.aphrody.com.conf`),
# versionne a cote de celui-ci. Le laisser dans les deux ferait deux blocs pour un
# `server_name`, et nginx retiendrait silencieusement le premier charge.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.aphrody.com cdn.aphrody.com
        bot.aphrody.com admin.aphrody.com n2b.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /health {
        proxy_pass http://127.0.0.1:8084/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- api.aphrody.com : l'API de lecture, et RIEN d'autre -------------------------------------
# Le meme service que `aphrody.com`, mais restreint a ses espaces de donnees. Sans cette
# restriction, l'hote servirait aussi les pages HTML : deux origines rendraient le meme
# contenu, chacune avec son propre canonique — le doublon exact que `hreflang` et `canonical`
# existent pour eviter. D'ou le 404 par defaut et le `noindex`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=nie_assets burst=40 nodelay;
    limit_conn nie_conn 16;
    limit_req_status 429;
    limit_conn_status 429;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz { proxy_pass http://127.0.0.1:8085/healthz; proxy_set_header Host $host; }
    location = /health  { proxy_pass http://127.0.0.1:8085/healthz; proxy_set_header Host $host; }
    location = /llms.txt      { proxy_pass http://127.0.0.1:8085/llms.txt; proxy_set_header Host $host; }
    location = /llms-full.txt { proxy_pass http://127.0.0.1:8085/llms-full.txt; proxy_set_header Host $host; }

    location /api/ { proxy_pass http://127.0.0.1:8085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /f/   { proxy_pass http://127.0.0.1:8085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /b    { proxy_pass http://127.0.0.1:8085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # Tout le reste — les pages, le bundle — n'a rien a faire ici.
    location / { return 404; }
}

# --- L'apex et `www` : 308 vers le site ------------------------------------------------------
# Ils ne servent plus rien eux-memes. Un 308 preserve la methode et le corps — un POST vers
# l'apex arrive en POST sur `nie.` — la ou un 301 le transformerait en GET. Le HSTS reste
# pose : un redirecteur qui l'omet laisse une premiere requete partir en clair.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aphrody.com www.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    return 308 https://nie.aphrody.com$request_uri;
}

# --- HTTP -> HTTPS, pour tous les hotes de ce certificat ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com api.aphrody.com downloads.aphrody.com
        cdn.aphrody.com bot.aphrody.com admin.aphrody.com
        bxc.aphrody.com nie.aphrody.com n2b.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}

# --- mcp.aphrody.com : recopie a l'identique, ne pas modifier -------------------------------
# Ce bloc est le seul des onze qui reponde aujourd'hui (401 sans jeton, ce qui est correct).
# Il est reproduit tel quel pour que ce fichier remplace l'original sans rien perdre.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 1m;

    location = / {
        proxy_pass http://127.0.0.1:8808/mcp;
        include /etc/nginx/conf.d/snippets-mcp.inc;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8808/mcp;
        include /etc/nginx/conf.d/snippets-mcp.inc;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8808/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}
