#
# `bxc.aphrody.com` — capture VERBATIM de `/etc/nginx/conf.d/bxc.aphrody.com.conf`.
#
# Ce vhost sert la vitrine du depot `bxc`, pas ce depot-ci. Il est versionne ICI parce qu'il
# partage le certificat `letsencrypt/live/aphrody.com` et le fichier voisin
# `aphrody.com.conf` : sans lui, l'inventaire du domaine serait faux, et `bxc.` reapparaitrait
# un jour dans le bloc partage — deux blocs pour un `server_name`, dont nginx ne garde
# silencieusement que le premier.
#
# **Il ne se modifie pas ici.** Toute evolution vient du depot `bxc` ; cette copie se
# rafraichit depuis la machine.

# BXC public showcase: nginx terminates TLS and forwards only to loopback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bxc.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
