# SPDX-License-Identifier: Apache-2.0
#
# `bxc.aphrody.com` — retired public placeholder for a future project.
#
# Keep TLS and return an explicit retirement response so a stopped local origin cannot produce
# a 502. The repository and local CLI remain available for future development.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bxc.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 410 '{"status":"retired","service":"bxc.aphrody.com"}\n';
        default_type application/json;
    }
}
